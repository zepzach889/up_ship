<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Up, Ship!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,400;0,600;0,700;1,400&family=Poiret+One&family=Special+Elite&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="bar">
    <div class="wordmark" aria-label="Up, Ship!">
      <span class="step" aria-hidden="true"></span>
      <span class="wordmark-text">Up, Ship!</span>
      <span class="step step-r" aria-hidden="true"></span>
    </div>

    <div class="clock">
      <span id="date" class="date"></span>
      <span id="time" class="time"></span>
    </div>

    <div class="turns">
      <button id="next-turn" class="next-turn" title="Play the next half day (N or Enter)">Next turn</button>
      <div class="speeds" role="group" aria-label="Auto-play">
        <span class="auto-label">Auto-play</span>
        <button data-auto="0" title="Auto-play off (Space)" aria-label="Auto-play off">
          <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="5" y="4" width="3.5" height="12"/><rect x="11.5" y="4" width="3.5" height="12"/></svg>
        </button>
        <button data-auto="1" title="Auto-play, normal (1)" aria-label="Auto-play, normal">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M6 4 L15 10 L6 16 Z"/></svg>
        </button>
        <button data-auto="2" title="Auto-play, fast (2)" aria-label="Auto-play, fast">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M2 4 L10 10 L2 16 Z M10 4 L18 10 L10 16 Z"/></svg>
        </button>
        <button data-auto="3" title="Auto-play, fastest (3)" aria-label="Auto-play, fastest">
          <svg viewBox="0 0 24 20" aria-hidden="true"><path d="M1 4 L8 10 L1 16 Z M8 4 L15 10 L8 16 Z M15 4 L22 10 L15 16 Z"/></svg>
        </button>
      </div>
    </div>

    <button id="company" class="company" title="Company statistics" hidden></button>

    <div class="funds">
      <span class="funds-label">Funds</span>
      <span id="money" class="money"></span>
    </div>

    <button id="new-game" class="plain">New game</button>
  </header>

  <main class="stage">
    <div id="map" class="map-wrap"></div>

    <aside id="panel" class="panel" hidden>
      <div class="panel-inner">
        <button id="panel-close" class="close" aria-label="Close">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5 L15 15 M15 5 L5 15"/></svg>
        </button>
        <div id="panel-body" aria-live="polite"></div>
      </div>
    </aside>

    <nav class="dock" aria-label="Company">
      <button data-open="contracts">Contracts</button>
      <button data-open="shipyard">Shipyard</button>
      <button data-open="fleet">Fleet</button>
      <button data-open="routes">Routes</button>
      <button data-open="finances">Finances</button>
      <button data-open="telegrams">Telegrams</button>
    </nav>

    <div id="draft" class="draft" hidden>
      <p class="draft-title">New route</p>
      <p id="draft-text" class="draft-text"></p>
      <div class="draft-actions">
        <label class="draft-circuit"><input type="checkbox" id="draft-circuit"> Circuit (return to the first city)</label>
        <button id="draft-undo" class="btn-quiet">Undo last stop</button>
        <button id="draft-cancel" class="btn-quiet">Cancel</button>
        <button id="draft-create" class="btn">Create route</button>
      </div>
    </div>

    <p id="notice" class="notice" role="status" hidden></p>

    <aside id="tutorial" class="tutorial" hidden>
      <p id="tutorial-step" class="tutorial-step"></p>
      <p id="tutorial-text" class="tutorial-text"></p>
      <div class="btn-row"><button id="tutorial-skip" class="btn-quiet">Skip tutorial</button><button id="tutorial-finish" class="btn" hidden>Finish</button></div>
    </aside>

    <div id="telegrams" class="telegrams" aria-live="polite" hidden>
      <button class="tg-all btn-quiet" hidden>Dismiss all</button>
    </div>

    <div class="zoom" role="group" aria-label="Zoom">
      <button id="zoom-in" aria-label="Zoom in">+</button>
      <button id="zoom-out" aria-label="Zoom out">−</button>
    </div>

    <p class="hint">Press Next turn (or N) to play half a day, or turn on auto-play. Click a city, route, or ship for details. Order ships from the Shipyard and draw new routes from Routes.</p>
  </main>

  <script src="js/data/map-europe.js"></script>
  <script src="js/data/cities.js"></script>
  <script src="js/data/ships.js"></script>
  <script src="js/data/nations.js"></script>
  <script src="js/emblem.js"></script>
  <script src="js/shipart.js"></script>
  <script src="js/sim.js"></script>
  <script src="js/contracts.js"></script>
  <script src="js/map.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/setup.js"></script>
  <script src="js/tutorial.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
